<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zenter Bridge</title>
  <link rel="icon" href="assets/logo.ico" />

  <style>
    :root{
      --bg0:#f6f7fb;
      --bg1:#eef2ff;
      --panel: rgba(255,255,255,.84);
      --card: rgba(255,255,255,.92);
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --soft: rgba(15,23,42,.06);
      --shadow: 0 14px 36px rgba(15,23,42,.12);
      --shadow2: 0 8px 18px rgba(15,23,42,.10);
      --radius:18px;
      --radius2:14px;

      --accent:#4f46e5;
      --accent2:#38bdf8;
      --good:#16a34a;
      --bad:#dc2626;
      --warn:#f59e0b;
      --focus: 0 0 0 4px rgba(79,70,229,.18);
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family: "Space Grotesk", "Sora", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 8% 0%, rgba(79,70,229,.16), transparent 58%),
        radial-gradient(800px 420px at 92% 12%, rgba(56,189,248,.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }

    .wrap{
      max-width: 1180px;
      margin: 18px auto;
      padding: 0 16px 32px;
    }

    /* ── Topbar ─────────────────────────────────────── */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      animation: rise .45s ease;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .logo{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      overflow:hidden;
      flex-shrink: 0;
    }
    .logo img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text h1{
      font-size: 15px;
      letter-spacing:.2px;
      line-height:1.2;
      font-weight: 700;
    }
    .brand-text .bridge-sub{
      font-size: 11px;
      color: var(--muted);
      line-height: 1;
    }

    .version-badge{
      font-size: 11px;
      color: var(--muted);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.6);
      font-family: ui-monospace, monospace;
    }

    .top-right{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.7);
      box-shadow: var(--shadow2);
      white-space:nowrap;
    }

    /* ── Status dots ─────────────────────────────────── */
    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.good{ background: var(--good); animation: pulse-ring 2s ease infinite; }
    .dot.bad{ background: var(--bad); }
    .dot.warn{ background: var(--warn); }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0   rgba(22,163,74,.55); }
      70%  { box-shadow: 0 0 0 7px rgba(22,163,74,0);   }
      100% { box-shadow: 0 0 0 0   rgba(22,163,74,0);   }
    }

    /* ── Grid & Cards ───────────────────────────────── */
    .grid{
      margin-top: 14px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card{
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78));
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      animation: rise .5s ease;
    }

    .card h2{
      font-size: 14px;
      color: var(--text);
      letter-spacing: .2px;
      font-weight: 700;
    }

    .subtext{ color: var(--muted); font-size: 12px; margin-top: 2px; }
    .small{ font-size: 12px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted{ color: var(--muted); }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 14px;
    }

    .actions{
      display:flex;
      gap: 7px;
      flex-wrap:wrap;
      align-items:center;
    }

    /* ── Device cards ────────────────────────────────── */
    .devices-list{ display:flex; flex-direction:column; gap: 10px; }

    .device-card{
      border: 1px solid var(--line);
      border-radius: var(--radius2);
      padding: 14px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow2);
      animation: rise .4s ease;
      transition: border-color .2s;
    }
    .device-card:has(.device-status-dot.good){
      border-color: rgba(22,163,74,.2);
    }

    .device-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .device-title{
      display:flex;
      align-items:center;
      gap: 9px;
      min-width: 0;
    }

    .device-title strong{
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-status-dot{
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .device-status-dot.good { background: var(--good); animation: pulse-ring 2s ease infinite; }
    .device-status-dot.bad  { background: var(--bad); }
    .device-status-dot.idle { background: var(--muted); }

    .device-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .device-footer{
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    /* ── Form fields ─────────────────────────────────── */
    label{
      font-size: 12px;
      color: rgba(11,19,32,.8);
      margin-bottom: 5px;
      display:block;
      font-weight: 500;
    }
    .hint{ font-size: 11px; color: var(--muted); }

    .field{
      border: 1px solid rgba(11,19,32,.14);
      background: rgba(255,255,255,.9);
      border-radius: 10px;
      padding: 9px 11px;
      outline: none;
      color: var(--text);
      font-size: 13px;
      width:100%;
      transition: .15s ease;
      font-family: inherit;
    }
    .field::placeholder{ color: rgba(90,107,123,.7); }
    .field:focus{ border-color: rgba(79,70,229,.45); box-shadow: var(--focus); }
    .field:disabled{ opacity: .65; cursor: not-allowed; }

    .row{ display:flex; gap: 10px; flex-wrap:wrap; align-items:center; }

    /* ── Buttons ─────────────────────────────────────── */
    .btn{
      border: 1px solid rgba(11,19,32,.14);
      background: rgba(255,255,255,.76);
      color: rgba(11,19,32,.9);
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      transition: .15s ease;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.95); box-shadow: var(--shadow2); }
    .btn:active{ transform: translateY(0); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important; box-shadow: none !important; }

    .btn.primary{
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }
    .btn.primary:hover{ background: #4338ca; border-color: #4338ca; }

    .btn.danger{
      border-color: rgba(220,38,38,.28);
      background: rgba(220,38,38,.08);
      color: rgba(127,29,29,.95);
    }
    .btn.danger:hover{ background: rgba(220,38,38,.14); }

    .btn.ghost{
      background: transparent;
      border-color: rgba(11,19,32,.12);
      box-shadow: none;
    }
    .btn.ghost:hover{ background: rgba(11,19,32,.04); }

    /* ── Log panel ───────────────────────────────────── */
    .logwrap{
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius2);
      overflow:hidden;
      background: rgba(255,255,255,.7);
    }
    .loghead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 9px 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.92);
    }
    .logbody{
      height: 300px;
      overflow-y: auto;
      background: rgba(15,23,42,.025);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 0;
    }
    .log-line{
      padding: 2px 12px;
      border-radius: 0;
      white-space: pre-wrap;
      word-break: break-all;
      color: rgba(15,23,42,.75);
    }
    .log-err    { color: #991b1b; background: rgba(254,226,226,.5); }
    .log-warn   { color: #78350f; background: rgba(254,243,199,.5); }
    .log-ok     { color: #14532d; background: rgba(220,252,231,.45); }
    .log-accent { color: #312e81; background: rgba(238,242,255,.55); }

    .logbody::-webkit-scrollbar{ width: 8px; }
    .logbody::-webkit-scrollbar-thumb{ background: rgba(11,19,32,.15); border-radius: 999px; }
    .logbody::-webkit-scrollbar-track{ background: transparent; }

    /* ── Device stats row ───────────────────────────── */
    .device-stats{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .stat-chip{
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(15,23,42,.04);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .stat-chip.ok  { color: var(--good); background: rgba(22,163,74,.06); border-color: rgba(22,163,74,.2); }
    .stat-chip.err { color: var(--bad);  background: rgba(220,38,38,.06); border-color: rgba(220,38,38,.2); }
    .stat-chip.warn{ color: #92400e; background: rgba(245,158,11,.07); border-color: rgba(245,158,11,.25); }
    .stat-chip b   { font-weight: 600; color: inherit; }

    /* ── Empty state ─────────────────────────────────── */
    .empty-state{
      text-align: center;
      padding: 52px 24px;
    }
    .empty-icon{
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(79,70,229,.12), rgba(56,189,248,.12));
      border: 1px solid rgba(79,70,229,.15);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-icon svg{ opacity: .5; }
    .empty-title{
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .empty-sub{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Toast ───────────────────────────────────────── */
    #toasts{
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      pointer-events: none;
    }
    .toast{
      pointer-events: all;
      min-width: 220px;
      max-width: 360px;
      padding: 11px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      line-height: 1.4;
      box-shadow: 0 8px 28px rgba(0,0,0,.2);
      cursor: pointer;
      animation: toastIn .28s cubic-bezier(.16,1,.3,1);
    }
    .toast.out{ animation: toastOut .22s ease forwards; }
    .toast.ok  { background: #16a34a; color: #fff; }
    .toast.err { background: #dc2626; color: #fff; }
    .toast.warn{ background: #d97706; color: #fff; }
    .toast.info{ background: rgba(15,23,42,.9); backdrop-filter: blur(8px); color: #fff; }

    @keyframes toastIn{
      from{ opacity:0; transform: translateY(14px) scale(.94); }
      to  { opacity:1; transform: translateY(0)    scale(1);   }
    }
    @keyframes toastOut{
      to{ opacity:0; transform: translateY(8px) scale(.94); }
    }

    /* ── Confirm modal ───────────────────────────────── */
    .modal-overlay{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      backdrop-filter: blur(5px);
      z-index: 8000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn .2s ease;
    }
    .modal{
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      max-width: 380px;
      width: 92%;
      box-shadow: 0 28px 64px rgba(15,23,42,.22);
      animation: rise .25s ease;
    }
    .modal-title{
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .modal-msg{
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .modal-actions{
      display: flex;
      gap: 9px;
      justify-content: flex-end;
    }

    @keyframes fadeIn{
      from{ opacity:0; }
      to  { opacity:1; }
    }
    @keyframes rise{
      from{ opacity:0; transform: translateY(8px); }
      to  { opacity:1; transform: translateY(0);   }
    }

    @media (max-width: 900px){
      .device-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <img src="assets/logo.png" alt="" />
        </div>
        <div class="brand-text">
          <h1>Zenter Bridge</h1>
          <div class="bridge-sub">Control de acceso</div>
        </div>
        <span class="version-badge" id="versionBadge"></span>
      </div>

      <div class="top-right">
        <div class="pill" id="statusPill">
          <span class="dot" id="statusDot"></span>
          <span id="state">...</span>
        </div>
        <div class="pill" id="updatePill" style="display:none">
          <span class="dot" id="updateDot"></span>
          <span id="updateState"></span>
        </div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <div>
            <h2>Dispositivos</h2>
            <div class="subtext">Equipos de control de asistencia conectados a este bridge.</div>
          </div>
          <div class="actions">
            <button class="btn primary" id="btnAddDevice">+ Agregar dispositivo</button>
          </div>
        </div>
        <div id="devicesList" class="devices-list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Sistema</h2>
            <div class="subtext">Actualizaciones y registros de actividad</div>
          </div>
          <div class="actions">
            <button class="btn" id="btnUpdateCheck">Buscar actualizaciones</button>
            <button class="btn primary" id="btnUpdateInstall" disabled>Instalar actualización</button>
          </div>
        </div>

        <div class="logwrap">
          <div class="loghead">
            <span class="small muted">Registros en tiempo real</span>
            <button class="btn ghost small" id="btnClearLogs" style="padding:4px 10px;font-size:11px">Limpiar</button>
          </div>
          <div class="logbody" id="logs"></div>
        </div>

        <div class="subtext" style="margin-top:10px">
          Si el bridge está funcionando verás "Boundary detectado" y eventos cuando haya actividad.
        </div>
      </section>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="./renderer.js"></script>

  <script>
    document.getElementById("btnClearLogs").onclick = () => {
      document.getElementById("logs").innerHTML = "";
    };

    function syncPills() {
      const state = (document.getElementById("state")?.textContent || "").toUpperCase();
      const dot = document.getElementById("statusDot");
      if (dot) {
        dot.classList.remove("good","bad","warn");
        if (state.includes("ACTIVO") || state.includes("RUNNING")) dot.classList.add("good");
        else if (state.includes("DETENIDO") || state.includes("STOP")) dot.classList.add("bad");
        else dot.classList.add("warn");
      }

      const upd = (document.getElementById("updateState")?.textContent || "").toLowerCase();
      const uDot = document.getElementById("updateDot");
      if (uDot) {
        uDot.classList.remove("good","bad","warn");
        if (upd.includes("actualizado")) uDot.classList.add("good");
        else if (upd.includes("lista") || upd.includes("descarg")) uDot.classList.add("good");
        else if (upd.includes("error")) uDot.classList.add("bad");
        else uDot.classList.add("warn");
      }
    }

    setInterval(syncPills, 400);
  </script>
</body>
</html>
